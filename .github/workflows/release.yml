name: Release

on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      tag:
        description: 'Tag to build (e.g. v1.7.0)'
        required: true
        default: 'v1.7.0'

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262  # v4
        with:
          fetch-depth: 0

      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3  # v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - uses: android-actions/setup-android@9fc6c4e9069bf8d3d10b2204b1fb8f6ef7065407  # v3
        with:
          packages: 'platforms;android-35 platforms;android-37 build-tools;35.0.0 build-tools;36.0.0'

      - name: Restore keystore from secret
        run: |
          if [ -z "${{ secrets.KEYSTORE_BASE64 }}" ]; then
            echo "::warning::KEYSTORE_BASE64 未配置，将回退到 debug 签名"
          else
            echo "${{ secrets.KEYSTORE_BASE64 }}" | base64 -d > release.jks
            echo "keystore restored: $(stat -c%s release.jks) bytes"
          fi

      - name: Build Release APK
        env:
          # CI=true 会让 signingConfigs 在无 release.jks 时回退到 debug keystore
          CI: true
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEYSTORE_ALIAS: ${{ secrets.KEYSTORE_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          chmod +x gradlew
          ./gradlew assembleRelease --no-daemon --stacktrace

      - name: Verify APK is signed
        run: |
          APK=app/build/outputs/apk/release/app-release.apk
          ls -la "$APK"
          "${ANDROID_HOME}/build-tools/36.0.0/apksigner" verify --print-certs "$APK" | tee signer.txt
          grep -q "RainyToken" signer.txt && echo "✓ 正式签名 (RainyToken)" \
            || echo "::warning::使用 debug 签名（KEYSTORE_BASE64 未配置）"

      - name: Rename APK
        id: rename
        run: |
          VER="${GITHUB_REF_NAME:-${{ github.event.inputs.tag }}}"
          cp app/build/outputs/apk/release/app-release.apk "RainyToken-${VER}.apk"
          echo "asset=RainyToken-${VER}.apk" >> "$GITHUB_OUTPUT"
          echo "ver=${VER}" >> "$GITHUB_OUTPUT"

      - name: Build changelog
        id: changelog
        run: |
          # 收集上一个 tag 以来的提交；无历史 tag 时取最近 30 条
          PREV=$(git describe --tags --abbrev=0 "${GITHUB_REF_NAME}^" 2>/dev/null || echo "")
          if [ -n "$PREV" ]; then
            echo "## 变更 (自 $PREV)" > CHANGES.md
            git log --pretty=format:'- %s' "$PREV..${GITHUB_REF_NAME}" >> CHANGES.md
          else
            echo "## 变更" > CHANGES.md
            git log --pretty=format:'- %s' -30 >> CHANGES.md
          fi
          cat CHANGES.md

      - name: Create Release
        uses: softprops/action-gh-release@3bb12739c298aeb8a4eeaf626c5b8d85266b0e65  # v2
        with:
          name: "RainyToken ${{ steps.rename.outputs.ver }}"
          body_path: CHANGES.md
          files: ${{ steps.rename.outputs.asset }}
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Cleanup keystore (always run for security)
        if: always()
        run: rm -f release.jks signer.txt
